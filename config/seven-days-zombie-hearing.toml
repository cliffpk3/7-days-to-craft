
#7DTC zombie hearing; affects loaded zombies outside the horde. Stronger variants hear at half of the configured radii.
[hearing]
	enabled = true
	#Maximum distance for an unsuppressed gunshot, in blocks.
	#Range: 0 ~ 96
	gunshotRadius = 48
	#Maximum distance for a gun with a suppressor, in blocks.
	#Range: 0 ~ 96
	silencedRadius = 16
	#Maximum distance for a militia death scream, in blocks.
	#Range: 0 ~ 96
	screamRadius = 24
	#Maximum distance for a dying zombie's cry, in blocks.
	#Range: 0 ~ 48
	zombieCryRadius = 14
	#Maximum zombies responding to one sound.
	#Range: 1 ~ 40
	maxResponders = 16
