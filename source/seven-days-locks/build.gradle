plugins { id 'net.minecraftforge.gradle' version '5.1.+' }
group='dev.sevendaystocraft'
version='1.0.1'
archivesBaseName='seven-days-locks'
java.toolchain.languageVersion=JavaLanguageVersion.of(17)
minecraft { mappings channel:'official', version:'1.20.1' }
repositories { mavenCentral() }
dependencies {
 minecraft 'net.minecraftforge:forge:1.20.1-47.1.3'
 compileOnly fg.deobf(files('../../mods/infernalmobs-1.20.1.3_custom.jar'))
 compileOnly fg.deobf(files('../../mods/The-Hordes-1.20.1-1.6.3i-all.jar'))
 compileOnly fg.deobf(files('../../mods/advancedcompass.forge.1.20.1-1.2.15.jar'))
 compileOnly fg.deobf(files('../../mods/trashslot-forge-1.20-15.1.0.jar'))
 compileOnly fg.deobf(files('../../mods/tacz-1.20.1-1.1.8-hotfix.jar'))
}
jar { manifest { attributes(['Specification-Title':'seven_days_locks','Specification-Vendor':'7 Days to Craft','Specification-Version':'1','Implementation-Title':project.name,'Implementation-Version':project.jar.archiveVersion,'Implementation-Vendor':'7 Days to Craft','MixinConfigs':'seven_days_locks.mixins.json']) } }
jar.finalizedBy('reobfJar')
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8' }
